<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Movie</title>
    <link rel="stylesheet" href="login.css"> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <a href="../app/demo/demo.html" class="logo">MOVIE</a>
            
            <h2>Create Account</h2>
            <p>Join Movie to start tracking your movies.</p>

            <form id="register-form">
                <div class="input-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Create a password" required>
                </div>

                <button type="submit" class="btn-primary">Register</button>
            </form>

            <div class="register-link">
                Already have an account? <a href="login.html">Log in</a>
            </div>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
